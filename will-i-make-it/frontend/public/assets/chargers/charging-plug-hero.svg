<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" fill="none">
  <defs>
    <!-- Dark deep charcoal background for card -->
    <linearGradient id="plugCardBg" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0c0f17"/>
    </linearGradient>
    
    <!-- Vibrant orange horizontal stripes -->
    <linearGradient id="heroOrangeStripe" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5520"/>
      <stop offset="60%" stop-color="#ea4310"/>
      <stop offset="100%" stop-color="#c83204"/>
    </linearGradient>

    <!-- Plug Shadow & Lighting -->
    <filter id="plugGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <linearGradient id="plugGunBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3346"/>
      <stop offset="40%" stop-color="#1a2130"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <linearGradient id="plugHeadFace" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#181f2c"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <linearGradient id="handSkinGrad" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#df926c"/>
      <stop offset="40%" stop-color="#c97c55"/>
      <stop offset="80%" stop-color="#a45834"/>
      <stop offset="100%" stop-color="#7a3a1c"/>
    </linearGradient>
  </defs>

  <!-- Card Background with soft inner glow -->
  <rect width="380" height="340" rx="24" fill="url(#plugCardBg)"/>
  
  <!-- Left Half: Orange Horizontal Parallel Stripes (Exact match to Meitriya design) -->
  <g opacity="0.95">
    <rect x="22" y="160" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="174" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="188" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="202" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="216" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="230" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="244" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="258" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="272" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="286" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="300" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
    <rect x="22" y="314" width="180" height="6.5" rx="3.25" fill="url(#heroOrangeStripe)"/>
  </g>

  <!-- High-Precision Callout Line and Stat (Meitriya 99.9% callout) -->
  <g id="callout-group">
    <!-- Target Point on Charging Gun Connector Rim -->
    <circle cx="152" cy="164" r="5" fill="#ffffff" stroke="#ff5520" stroke-width="2.5"/>
    <!-- Angled Line -->
    <line x1="152" y1="164" x2="204" y2="114" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 2"/>
    <line x1="204" y1="114" x2="280" y2="114" stroke="#94a3b8" stroke-width="1.4"/>
    <circle cx="204" cy="114" r="2.5" fill="#ff5520"/>

    <!-- Callout Typography -->
    <text x="216" y="96" fill="#ffffff" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="-0.5">99.8%</text>
    <text x="216" y="110" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">Bayesian Reliability</text>
  </g>

  <!-- Heavy High-Power CCS 2 EV Fast Charging Gun -->
  <g id="charging-gun" filter="url(#plugGlow)">
    <!-- Gun Head Perspective Ellipse (Dark Gunmetal Finish) -->
    <ellipse cx="120" cy="148" rx="46" ry="52" fill="url(#plugGunBody)" stroke="#3b4861" stroke-width="3"/>
    <ellipse cx="120" cy="148" rx="39" ry="45" fill="url(#plugHeadFace)"/>
    
    <!-- Pin Sockets Arrangement (CCS Type 2 AC 7-pin cluster + 2 DC fast pins) -->
    <!-- Top 3 AC signal pins -->
    <circle cx="106" cy="126" r="5" fill="#141a24" stroke="#475569" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="5" fill="#141a24" stroke="#475569" stroke-width="1.5"/>
    <circle cx="134" cy="126" r="5" fill="#141a24" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Middle 2 AC Power pins -->
    <circle cx="108" cy="142" r="6.5" fill="#0b0e14" stroke="#ff5520" stroke-width="2"/>
    <circle cx="132" cy="142" r="6.5" fill="#0b0e14" stroke="#ff5520" stroke-width="2"/>
    
    <!-- Lower 2 DC Fast High-Voltage Pins (Teal highlighted) -->
    <circle cx="110" cy="164" r="8" fill="#141a24" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="130" cy="164" r="8" fill="#141a24" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Gun Handle Body Extending Downward -->
    <path d="M 98 194 C 98 194 102 260 106 340 L 148 340 C 144 260 142 194 142 194 Z" fill="#111622" stroke="#252f44" stroke-width="2.5"/>
    <path d="M 112 210 L 112 340" stroke="#ff5520" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Hand Grasping Ergonomic Grip (Photorealistic fingers wrapping around handle) -->
    <g id="human-hand">
      <!-- Index finger wrapping around right -->
      <path d="M 134 200 C 154 200 172 212 168 226 C 164 234 150 234 134 234 Z" fill="url(#handSkinGrad)" stroke="#662910" stroke-width="1.2"/>
      
      <!-- Middle finger -->
      <path d="M 132 234 C 156 234 174 246 170 260 C 166 268 148 268 130 268 Z" fill="url(#handSkinGrad)" stroke="#662910" stroke-width="1.2"/>
      
      <!-- Ring finger -->
      <path d="M 130 268 C 152 268 168 278 164 290 C 160 298 144 298 128 298 Z" fill="url(#handSkinGrad)" stroke="#662910" stroke-width="1.2"/>
      
      <!-- Pinky finger -->
      <path d="M 128 298 C 146 298 160 306 156 318 C 152 326 138 326 124 326 Z" fill="url(#handSkinGrad)" stroke="#662910" stroke-width="1.2"/>
      
      <!-- Thumb in front resting on left side of grip -->
      <path d="M 100 208 C 84 220 78 240 90 256 C 102 266 118 260 124 248 C 126 238 124 220 114 212 Z" fill="#e89e77" stroke="#662910" stroke-width="1.2"/>
      <path d="M 106 218 C 114 226 112 242 106 248" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    </g>
  </g>
</svg>
