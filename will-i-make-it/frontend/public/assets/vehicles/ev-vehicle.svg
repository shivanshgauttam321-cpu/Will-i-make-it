<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" fill="none">
  <defs>
    <!-- Ground Ambient Occlusion & Contact Shadow -->
    <filter id="carShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
    </filter>

    <!-- Metallic White Body Paint Gradients -->
    <linearGradient id="hoodGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e8ecf2"/>
      <stop offset="100%" stop-color="#c8d1de"/>
    </linearGradient>

    <linearGradient id="bodySideGrad" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="bumperFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glass Gradients with Sky Reflection -->
    <linearGradient id="windshieldGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="glassReflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome & Wheel Gradients -->
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <linearGradient id="spokeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Headlight Crystal Glow -->
    <linearGradient id="headlightGlow" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="260" cy="236" rx="220" ry="16" fill="#000000" fill-opacity="0.5" filter="url(#carShadow)"/>
  <ellipse cx="280" cy="238" rx="170" ry="8" fill="#000000" fill-opacity="0.75"/>

  <!-- CAR BODY (3/4 Isometric Perspective White Modern Electric SUV) -->
  <g id="vehicle-body">
    <!-- Underbody dark trim -->
    <path d="M 62 208 L 130 216 L 360 216 L 436 200 L 452 186 L 444 176 L 68 184 Z" fill="#090d15"/>

    <!-- Rear bumper & quarter panel (Left / Rear) -->
    <path d="M 52 168 C 48 152 56 138 72 126 C 90 114 116 104 150 96 L 220 90 L 226 182 L 126 198 L 74 196 C 60 196 52 182 52 168 Z" fill="url(#bodySideGrad)" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Side doors & sill -->
    <path d="M 148 96 L 320 86 L 334 186 L 126 198 Z" fill="url(#bodySideGrad)"/>

    <!-- Front Fender (Right / Front 3/4) -->
    <path d="M 320 86 L 388 94 C 418 100 450 118 464 136 C 472 146 476 158 472 168 L 460 186 L 434 200 L 372 204 L 334 186 Z" fill="url(#bumperFront)" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Hood / Bonnet (Angled plane with crisp crease lines) -->
    <path d="M 284 82 L 388 94 C 426 100 456 112 466 128 L 388 132 L 280 108 Z" fill="url(#hoodGrad)"/>
    
    <!-- Crisp Character Crease Line along shoulder -->
    <path d="M 72 126 Q 220 106 462 138" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 72 128 Q 220 108 462 140" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Roofline & Pillars (Sleek aerodynamic arch) -->
    <path d="M 108 108 C 130 76 172 52 230 46 C 280 42 320 54 348 76 L 284 82 L 220 90 L 150 96 Z" fill="#0f172a"/>

    <!-- Greenhouse / Window Glass (Deep obsidian with sky reflections) -->
    <!-- Rear side window -->
    <path d="M 124 102 C 140 82 170 66 210 60 L 212 90 L 146 96 Z" fill="url(#windshieldGrad)" stroke="#334155" stroke-width="1.2"/>
    <path d="M 126 100 L 190 64 L 210 90 Z" fill="url(#glassReflection)"/>

    <!-- Front side window -->
    <path d="M 218 60 C 252 56 288 62 312 76 L 306 90 L 218 90 Z" fill="url(#windshieldGrad)" stroke="#334155" stroke-width="1.2"/>
    <path d="M 220 60 L 290 64 L 306 90 Z" fill="url(#glassReflection)"/>

    <!-- Front Windshield (Raked aerodynamic glass) -->
    <path d="M 314 74 C 326 66 338 68 348 76 L 384 116 L 338 112 L 312 78 Z" fill="url(#windshieldGrad)" stroke="#334155" stroke-width="1.2"/>
    <path d="M 324 74 L 366 114" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Side Mirrors -->
    <path d="M 320 86 C 330 84 340 88 340 94 C 338 98 326 98 318 94 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>

    <!-- Front Nose & Closed EV Aerodynamic Grille -->
    <path d="M 444 140 C 466 142 478 152 476 166 C 474 176 464 184 446 186 L 434 186 C 420 182 414 170 416 158 C 418 146 430 140 444 140 Z" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Subtle EV Grille Mesh texture -->
    <line x1="430" y1="154" x2="466" y2="154" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="432" y1="162" x2="468" y2="162" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="436" y1="170" x2="462" y2="170" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Angular Matrix LED Headlight -->
    <polygon points="414,136 462,138 454,150 422,146" fill="url(#headlightGlow)" stroke="#38bdf8" stroke-width="1"/>
    <!-- LED Daytime Running Light strip -->
    <path d="M 416 136 L 460 138" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="442" cy="142" r="3" fill="#ffffff"/>
    <circle cx="430" cy="141" r="2.5" fill="#bae6fd"/>

    <!-- Door Handles (Flush aerodynamic pop-out handles) -->
    <rect x="178" y="116" width="22" height="4" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
    <rect x="256" y="112" width="22" height="4" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>

    <!-- Lower Door Body Cladding & Orange EV Accent Line -->
    <path d="M 136 188 L 336 178 L 340 184 L 134 196 Z" fill="#0f172a"/>
    <path d="M 140 190 L 334 180" stroke="#ff5520" stroke-width="2" stroke-linecap="round"/>

    <!-- WHEELS & TIRES -->
    <!-- Rear Wheel Arch Cladding -->
    <path d="M 86 196 C 84 152 136 150 140 198 Z" fill="#090d15"/>
    <!-- Front Wheel Arch Cladding -->
    <path d="M 346 186 C 348 136 424 136 430 192 Z" fill="#090d15"/>

    <!-- REAR WHEEL (Angled perspective) -->
    <g id="rear-wheel">
      <ellipse cx="112" cy="192" rx="34" ry="40" fill="#020617"/>
      <ellipse cx="112" cy="192" rx="26" ry="32" fill="url(#wheelRim)"/>
      <!-- Alloy Spokes -->
      <line x1="112" y1="164" x2="112" y2="220" stroke="url(#spokeGrad)" stroke-width="4" stroke-linecap="round"/>
      <line x1="90" y1="180" x2="134" y2="204" stroke="url(#spokeGrad)" stroke-width="4" stroke-linecap="round"/>
      <line x1="92" y1="206" x2="132" y2="178" stroke="url(#spokeGrad)" stroke-width="4" stroke-linecap="round"/>
      <!-- Wheel Hub Center with EV Orange Accent -->
      <circle cx="112" cy="192" r="7" fill="#0f172a" stroke="#ff5520" stroke-width="1.5"/>
      <circle cx="112" cy="192" r="3" fill="#ff5520"/>
    </g>

    <!-- FRONT WHEEL (Prominent 3/4 angled alloy rim) -->
    <g id="front-wheel">
      <ellipse cx="388" cy="184" rx="42" ry="48" fill="#020617"/>
      <ellipse cx="388" cy="184" rx="32" ry="38" fill="url(#wheelRim)"/>
      <!-- Dynamic Turbine Aero-Spokes (Diamond Cut Finish) -->
      <line x1="388" y1="150" x2="388" y2="218" stroke="url(#spokeGrad)" stroke-width="5" stroke-linecap="round"/>
      <line x1="360" y1="168" x2="416" y2="200" stroke="url(#spokeGrad)" stroke-width="5" stroke-linecap="round"/>
      <line x1="362" y1="202" x2="414" y2="166" stroke="url(#spokeGrad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Ventilated disc brake rotor visible through spokes -->
      <circle cx="388" cy="184" r="18" fill="none" stroke="#64748b" stroke-dasharray="3 3" stroke-width="2"/>
      <!-- Center Hub -->
      <circle cx="388" cy="184" r="9" fill="#0f172a" stroke="#ff5520" stroke-width="2"/>
      <circle cx="388" cy="184" r="4" fill="#ff5520"/>
    </g>
  </g>
</svg>
